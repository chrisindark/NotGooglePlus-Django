version: "3.9"

services:
  web:
    build: .
    container_name: django_notgoogleplus_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - notgoogleplus_django/.env.development
    depends_on:
      # - db
      - redis
      - localstack

  # db:
  #   image: mysql:8.4
  #   container_name: mysql_db
  #   restart: always
  #   environment:
  #     MYSQL_DATABASE: notgoogleplus
  #     MYSQL_USER: django_user
  #     MYSQL_PASSWORD: django_pass
  #     MYSQL_ROOT_PASSWORD: rootpass
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql/data

  redis:
    image: redis:7-alpine
    container_name: redis_dev
    restart: always
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:4.4.0
    container_name: ${LOCALSTACK_DOCKER_NAME:-localstack-main}
    ports:
      - "127.0.0.1:4566:4566" # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      - SERVICES=s3
      - DEBUG=${DEBUG:-1}
      - PERSISTENCE=${PERSISTENCE:-1}
    volumes:
      - ./localstack:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./scripts/init-localstack-s3.sh:/etc/localstack/init/ready.d/init-localstack-s3.sh

volumes:
  mysql_data:
