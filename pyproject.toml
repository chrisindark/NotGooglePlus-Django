[project]
name = "notgoogleplus-django"
version = "0.0.1"
description = ""
authors = [
    {name = "Christopher Paul",email = "chrisindark.notafraid@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "djangorestframework (>=3.17.1,<4.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "django (>=6.0.6,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-debug-toolbar (>=6.3.0,<7.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-countries (>=9.0.0,<10.0.0)",
    "drf-spectacular-sidecar (>=2026.6.1,<2027.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "drf-yasg[validation] (>=1.21.15,<2.0.0)",
    "django-solo (>=2.5.1,<3.0.0)",
    "django-health-check (>=4.4.2,<5.0.0)",
    "django-mysql (>=4.19.0,<5.0.0)",
    "faker (>=40.23.0,<41.0.0)",
    "django-seed (>=0.3.1,<0.4.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-redis (>=7.0.0,<8.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "channels[daphne] (>=4.3.2,<5.0.0)",
    "django-rq (>=4.1.0,<5.0.0)",
    "channels-redis (>=4.3.0,<5.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "boto3 (>=1.43.34,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.8.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.urls]
Repository = "https://github.com/chrisindark/NotGooglePlus-Django"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.hatch.build.targets.wheel]
packages = ["notgoogleplus_django"]

[dependency-groups]
dev = [
    "django-extensions (>=4.1,<5.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "boto3-stubs[s3] (>=1.43.35,<2.0.0)",
    "django-stubs (>=6.0.5,<7.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "types-python-dateutil (>=2.9.0.20260518,<3.0.0.0)",
    "types-redis (>=4.6.0.20241004,<5.0.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "notgoogleplus", "notgoogleplus_django"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
